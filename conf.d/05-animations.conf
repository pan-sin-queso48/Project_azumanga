animations {
    enabled = yes

    bezier = azumanga_rebote, 0.34, 1.40, 0.64, 1.00
    bezier = azumanga_rapido, 0.36, 0.00, 0.66, -0.56
    animation = windows, 1, 5, azumanga_rebote, popin 30%
    animation = windowsOut, 1, 4, azumanga_rapido, popin 80%
    animation = border, 1, 2, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 5, azumanga_rebote, slidevert
}
