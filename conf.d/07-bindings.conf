##################################################
# Atajos de teclado
##################################################

bind = $mainMod, T, exec, $terminal
bind = $mainMod, W, exec, $browser
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, $menu
bind = $mainMod, S, exec, steam

#cerrar ventana
bind = $mainMod, C, killactive

#pantalla completa
bind = $mainMod, F, fullscreen

#ventana flotante
bind = $mainMod, V, togglefloating

#salir de Hyprland
bind = $mainMod SHIFT, M, exit

bind = $mainMod, R, exec, rofi -show drun

#recargar configuración
bind = $mainMod SHIFT, R, exec, hyprctl reload

#tomar capturas
bind = , Print, exec, /home/joaquin/.config/hypr/scripts/para_tomar_capturas_con_grim.sh

# para poner un kitty extra
bind = $mainMod SHIFT, Q, exec, kitty

#para abrir dolphin en HOME
bind = $mainMod SHIFT, E, exec, dolphin ~

#alternar las ventanas a horizontal o vertical
#bind = $mainMod, J, togglesplit, #para la version de hyprland 0.53
bind = $mainMod, J, layoutmsg, togglesplit

#para apagar
bind = $mainMod, N, exec, systemctl poweroff

#para abrir kate.    kate >>> nano
bind = $mainMod, K, exec, kate

#para reproducir musica de mi playlist
bind = $mainMod, Y, exec, playlist.sh

#para la otra playlist
bind = $mainMod, U, exec, algo.sh

#para la siguiente cancion
bind = $mainMod, O, exec, playerctl --player=mpv next

#para la anterior cancion
bind = $mainMod, I, exec, playerctl --player=mpv previous

#para ponerle play o pausa
bind = $mainMod, P, exec, playerctl --player=mpv play-pause

#para matar mpv
bind = $mainMod, x, exec, pkill mpv

# para los escritorios, si tienes mas monitores sino pues ni modo

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# para mover ventanas a los escritorios

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

#mover el foco de las ventanas

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

#cosas para mover o cambier de tamaño
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
