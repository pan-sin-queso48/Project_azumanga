##################################################
# Decoración
##################################################

decoration {

    rounding = 12

    active_opacity = 1.00
    inactive_opacity = 0.96
    fullscreen_opacity = 1.00

    shadow {

        enabled = true

        range = 18

        render_power = 3

        color = rgba(00000044)
    }

    blur {

        enabled = true

        size = 5

        passes = 2

        noise = 0.01

        vibrancy = 0.15
    }
}
