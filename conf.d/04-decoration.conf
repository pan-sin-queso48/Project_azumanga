##################################################
# Decoración
##################################################

decoration {

    rounding = 15

    active_opacity = 1.00
    inactive_opacity = 0.96
    fullscreen_opacity = 1.00

    shadow {

        enabled = true

        range = 18

        render_power = 5

        color = rgba(f7c8d9ff) rgba(d6c7ffff) 45deg
    }

    blur {

        enabled = true

        size = 5

        passes = 2

        noise = 0.01

        vibrancy = 0.15
    }
}
